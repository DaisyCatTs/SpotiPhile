<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotiphile composition comparison</title>
<style>body{margin:0;background:#101215;color:#edf0f4;font:14px system-ui}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #343941}select,button{font:inherit;color:inherit;background:#22262d;padding:8px;border:1px solid #414752;border-radius:5px}button[aria-pressed=true]{border-color:#85b1ff;background:#233855}main{padding:20px;overflow:auto}img{display:block;max-width:100%;height:auto;margin:auto}p{margin:0;color:#b6c0ce}a{color:#a9c6ff}</style>
<header><strong>Spotiphile visual comparison</strong><select id="sample" aria-label="Page, theme and size"><option value="home-dark-1280">Home · Dark · 1280</option><option value="home-light-1280">Home · Light · 1280</option><option value="library-dark-1280">Library · Dark · 1280</option><option value="playlist-dark-1280">Playlist · Dark · 1280</option><option value="playlist-light-760">Playlist · Light · 760</option><option value="playlist-oled-1440">Playlist · OLED · 1440</option></select><button id="before" aria-pressed="false">Before</button><button id="after" aria-pressed="true">After</button><a href="professional-shell.html">Interactive proposal</a><p>Unapproved proposals, fictional data. Before: host-scaled preview. After: exact-size headless capture. Compare layout, not sharpness.</p></header>
<main><img id="capture" alt="Spotiphile composition proposal"></main>
<script>let version='after';const sample=document.querySelector('#sample');function render(){document.querySelector('#capture').src=`refinement-captures/${version}-${sample.value}.png`;document.querySelector('#before').setAttribute('aria-pressed',version==='before');document.querySelector('#after').setAttribute('aria-pressed',version==='after')}sample.addEventListener('change',render);for(const value of ['before','after'])document.querySelector('#'+value).addEventListener('click',()=>{version=value;render()});render();</script>
</html>
